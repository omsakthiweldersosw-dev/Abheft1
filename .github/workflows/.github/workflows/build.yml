
name: Build Abheft APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q Abheft-Android-Project.zip

      - name: Build APK
        run: gradle -p Abheft assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abheft-debug-apk
          path: Abheft/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
